<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cryptex Executor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: black;
      position: relative;
    }

    .cursor-light {
      position: fixed;
      pointer-events: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,0,0,0.3) 0%, transparent 80%);
      transform: translate(-50%, -50%);
      z-index: 1000;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: white;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: red;
      text-shadow: 0 0 10px red;
    }

    .buttons {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 1rem 2rem;
      background: black;
      border: 2px solid red;
      color: red;
      font-size: 1.1rem;
      border-radius: 8px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: red;
      transition: left 0.4s;
      z-index: 0;
    }

    .btn:hover::before {
      left: 0;
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn:hover {
      color: black;
    }

    .section {
      margin-top: 3rem;
      max-width: 600px;
      text-align: center;
    }

    .section h2 {
      color: red;
      margin-bottom: 1rem;
    }

    .features-list {
      list-style-type: none;
      color: white;
      font-size: 1.1rem;
      margin-top: 1rem;
    }

    .features-list li {
      margin-bottom: 0.8rem;
    }

    /* Red Drops Animation */
    .drop {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: red;
      border-radius: 50%;
      animation: drop 2s infinite;
      z-index: 0;
    }

    @keyframes drop {
      0% {
        transform: translateY(-10px);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    /* Multiple drops animation */
    .drop:nth-child(odd) {
      animation-duration: 1.5s;
    }

    .drop:nth-child(even) {
      animation-duration: 2.5s;
    }

  </style>
</head>
<body>
  <div class="cursor-light" id="cursorLight"></div>
  <div class="container">
    <h1>Cryptex Executor</h1>
    <div class="buttons">
      <button class="btn" onclick="window.location.href='https://gofile.io/d/0RxV0T'">
        <span>Download</span>
      </button>
    </div>

    <div class="section">
      <h2>Features</h2>
      <ul class="features-list">
        <li>Fast injection</li>
        <li>96% sUNC</li>
        <li>99% UNC</li>
        <li>Level 8</li>
        <li>ScriptHub</li>
      </ul>
    </div>
  </div>

  <!-- Red drops background -->
  <div class="drops-container">
    <div class="drop" style="left: 5%; animation-delay: 0s;"></div>
    <div class="drop" style="left: 15%; animation-delay: 0.3s;"></div>
    <div class="drop" style="left: 25%; animation-delay: 0.6s;"></div>
    <div class="drop" style="left: 35%; animation-delay: 0.9s;"></div>
    <div class="drop" style="left: 45%; animation-delay: 1.2s;"></div>
    <div class="drop" style="left: 55%; animation-delay: 1.5s;"></div>
    <div class="drop" style="left: 65%; animation-delay: 1.8s;"></div>
    <div class="drop" style="left: 75%; animation-delay: 2.1s;"></div>
    <div class="drop" style="left: 85%; animation-delay: 2.4s;"></div>
    <div class="drop" style="left: 95%; animation-delay: 2.7s;"></div>
  </div>

  <script>
    const light = document.getElementById('cursorLight');
    document.addEventListener('mousemove', (e) => {
      light.style.left = e.clientX + 'px';
      light.style.top = e.clientY + 'px';
    });
  </script>
</body>
</html>
